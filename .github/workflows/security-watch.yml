name: Security watch

# Daily check of every pinned dependency in security/dependencies.json against
# OSV and the upstream repositories' GitHub security advisories (plus CISA KEV).
# Output is GitHub issues in this repository only: no code changes, no pull
# requests, no builds, no releases, no secrets beyond the issues-scoped token.
# Runs only in the private repository (the public mirror carries this file but
# the job is skipped there).
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: security-watch
  cancel-in-progress: false

jobs:
  watch:
    name: Dependency vulnerability watch (issues only)
    if: github.repository == 'permaevidence/briglia-cli-private'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Inventory matches the sources
        id: inventory
        run: python3 scripts/security_inventory.py --check
      # Raw public data for the local-tools advisory list (plan v16 §9.5.3).
      # Still no secrets and no signing here: the separate "Advisory list"
      # workflow validates, builds and signs it. A feed failure only marks
      # rows failed inside the bundle; it never fails the watch.
      - name: Fetch local-tool advisory data (input for the signed advisory list)
        if: always()
        run: python3 scripts/advisory_fetch.py --out "$RUNNER_TEMP/advisory-input"
      # Runs after the fetch so the LibreOffice curation findings (plan v20
      # §9.5.10.2, impl round-1 R6) reach the owner issue; only when the
      # inventory check passed, as before.
      - name: Check advisories and open or update issues
        if: always() && steps.inventory.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/security_watch.py --curation "$RUNNER_TEMP/advisory-input/curation.json"
      - name: Upload the advisory input bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: advisory-input
          path: ${{ runner.temp }}/advisory-input/advisory-input.json
          retention-days: 3
          if-no-files-found: ignore
