name: CI

on:
  push:
    branches: [main, 'wip/responses-*', 'wip/subscription-*', 'wip/browser-settings', 'wip/413-retry', 'wip/telegram-buttons', 'wip/release-*']
  pull_request:
  workflow_dispatch:

jobs:
  # Five test jobs run in parallel (3 Linux, 2 macOS); every step is the
  # pre-split step, unchanged (scripts/ci_inventory_test.py proves it against
  # scripts/fixtures/ci-inventory.json). "CI complete" fails unless all five
  # succeeded; the release promoter requires it.
  linux-core:
    name: Linux core (build, contracts, smoke, browser)
    runs-on: ubuntu-latest
    container: swift:6.1-jammy
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
      - name: Trust the exact checkout in the Swift container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install runtime dependencies
        run: |
          apt-get update
          apt-get install -y python3 python3-pip sudo poppler-utils imagemagick procps curl xz-utils zip unzip
      - name: Install Node.js LTS (nodejs.org, SHASUMS256-verified) for the live Playwright bootstrap check
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(curl -fsSL https://nodejs.org/dist/index.json | python3 -c 'import json,sys; print(next(e["version"] for e in json.load(sys.stdin) if isinstance(e.get("lts"), str)))')"
          FILE="node-${VERSION}-linux-x64.tar.xz"
          curl -fsSLO "https://nodejs.org/dist/${VERSION}/${FILE}"
          curl -fsSL "https://nodejs.org/dist/${VERSION}/SHASUMS256.txt" | grep " ${FILE}\$" | sha256sum -c -
          mkdir -p /opt/node && tar -xJf "${FILE}" -C /opt/node --strip-components=1
          echo "/opt/node/bin" >> "$GITHUB_PATH"
          /opt/node/bin/node --version
      - name: CI inventory (every pre-split step still runs, unchanged)
        run: python3 scripts/ci_inventory_test.py
      - name: Add host swap (Linux compiler memory headroom)
        run: python3 scripts/ci_host_swap.py
      - name: Build
        run: swift build -j 2
      - name: Background prune selftest
        run: .build/debug/briglia __background-prune-selftest
      - name: Persisted model source contract and negative tests
        run: python3 scripts/chat_persistence_contract_test.py
      - name: Installer next-step wording
        run: python3 scripts/installer_next_step_test.py
      - name: Wire comparator negative tests
        run: |
          python3 scripts/chat_wire_baseline_test.py
          python3 scripts/chronology_wire_migration_test.py
          python3 scripts/web_subagent_r2_wire_migration_test.py
          python3 scripts/harness_identity_migration_test.py
          python3 scripts/agents_md_migration_test.py
          python3 scripts/image_explicit_send_migration_test.py
          python3 scripts/read_file_description_migration_test.py
          python3 scripts/reasoning_history_removal_migration_test.py
          python3 scripts/image_schema_contract_test.py .build/debug/briglia
      - name: Lifecycle comparator negative tests
        run: |
          python3 scripts/chat_lifecycle_baseline_test.py
          python3 scripts/prune_lifecycle_migration_test.py
          python3 scripts/active_compaction_lifecycle_migration_test.py
          python3 scripts/newest_turn_protection_lifecycle_migration_test.py
          python3 scripts/subagent_dialogue_compaction_lifecycle_migration_test.py
          python3 scripts/chronology_lifecycle_migration_test.py
          python3 scripts/web_subagent_r2_lifecycle_migration_test.py
          python3 scripts/output_cap_removal_migration_test.py
          python3 scripts/summary_retention_lifecycle_migration_test.py
          python3 scripts/keep_summaries_lifecycle_migration_test.py
          python3 scripts/prune_schema_contract_test.py
      - name: Configured subscription shipped-client compatibility
        run: python3 scripts/subscription_client_test.py .build/debug/briglia
      - name: Smoke test
        run: python3 scripts/smoke_test.py .build/debug/briglia
        env:
          BRIGLIA_SELFTEST_REAL_PIP: "1"
      - name: Install Playwright (browser test of the quick-setup page)
        run: |
          python3 -m pip install playwright==1.55.0
          python3 -m playwright install --with-deps chromium
      - name: Quick-setup browser test
        run: |
          python3 scripts/quicksetup_browser_test.py .build/debug/briglia
          python3 scripts/quicksetup_browser_test.py .build/debug/briglia --close-at-finish
          python3 scripts/quicksetup_main_provider_browser_test.py .build/debug/briglia
          python3 scripts/subscription_browser_test.py
          python3 scripts/menu_browser_test.py
          python3 scripts/browser_settings_test.py .build/debug/briglia
      - name: ConversationManager split moved-lines check (C1 to C2, through 0.2.60)
        run: python3 scripts/cm_split_check.py --verify-commit 8bd2718465e1b2150cfcaac03d8274a59e56039e --c1 47865661a67cbaefe969cf60e7652e3f310bbcdd
      - name: Security Phase 0 (dependency inventory, security watch, resolved Swift pins, read-only Security line)
        run: python3 scripts/security_phase0_test.py .build/debug/briglia
      - name: Security Phase 2 (signed security metadata, release tooling, update-available notice)
        run: python3 scripts/security_phase2_test.py .build/debug/briglia
      - name: Security Phase 3 (known-vulnerability check of your own tools, signed advisory list, local matching, send-once messages)
        run: python3 scripts/security_phase3_test.py .build/debug/briglia
      - name: gws / WhatsApp removal (retirement migration selftest, wire-migration negative tests)
        run: |
          python3 scripts/drop_gws_whatsapp_migration_test.py
          .build/debug/briglia __retired-integrations-selftest
      - name: Security Phase 1 (private AgentMail / Node / Python runtimes, pin-freshness release gate)
        run: python3 scripts/security_phase1_test.py .build/debug/briglia

  linux-gates-a:
    name: Linux gates A (wire, lifecycle, Responses)
    runs-on: ubuntu-latest
    container: swift:6.1-jammy
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
      - name: Trust the exact checkout in the Swift container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install runtime dependencies
        run: |
          apt-get update
          apt-get install -y python3 python3-pip sudo poppler-utils imagemagick procps curl xz-utils zip unzip
      - name: Add host swap (Linux compiler memory headroom)
        run: python3 scripts/ci_host_swap.py
      - name: Chat Completions pinned-release differential gate
        run: python3 scripts/chat_wire_baseline.py --save-reference chat-wire-reference.json --baseline scripts/fixtures/chat-wire/ci-linux-x86_64-r2.json
      - name: Preserve pinned-release reference
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chat-wire-reference-${{ runner.os }}-${{ runner.arch }}
          path: chat-wire-reference.json
      - name: Chat Completions lifecycle r3 and shipped-client differential gate
        run: python3 scripts/chat_lifecycle_baseline.py --save-reference chat-lifecycle-reference.json --baseline scripts/fixtures/chat-lifecycle/ci-linux-x86_64-r2.json
      - name: Preserve pinned lifecycle reference
        # The reference is built from the pinned SOURCE, never the candidate, so
        # it is worth keeping when the frozen comparison fails: that is exactly
        # the evidence needed to review an environmental drift (runner image).
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chat-lifecycle-reference-${{ runner.os }}-${{ runner.arch }}
          path: chat-lifecycle-reference.json
      - name: Responses real-owner lifecycle
        run: python3 scripts/responses_lifecycle_test.py

  linux-gates-b:
    name: Linux gates B (active-turn, snapshots, user profile)
    runs-on: ubuntu-latest
    container: swift:6.1-jammy
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
      - name: Trust the exact checkout in the Swift container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install runtime dependencies
        run: |
          apt-get update
          apt-get install -y python3 python3-pip sudo poppler-utils imagemagick procps curl xz-utils zip unzip
      - name: Add host swap (Linux compiler memory headroom)
        run: python3 scripts/ci_host_swap.py
      - name: Active-turn compaction owners and negative controls
        run: |
          python3 scripts/active_compaction_contract_test.py
          python3 scripts/active_turn_compaction_test.py
      - name: Snapshot owner transactions and Mind transfer
        run: python3 scripts/prune_archive_owner_test.py
      - name: User-profile maintenance against v0.2.48 (unchanged requests, downgrade and re-upgrade)
        run: python3 scripts/user_context_wire_test.py

  macos-core:
    name: macOS core (build, contracts, smoke, browser)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
      - name: CI inventory (every pre-split step still runs, unchanged)
        run: python3 scripts/ci_inventory_test.py
      - name: Build
        run: swift build
      - name: Background prune selftest
        run: .build/debug/briglia __background-prune-selftest
      - name: Persisted model source contract and negative tests
        run: python3 scripts/chat_persistence_contract_test.py
      - name: Installer next-step wording
        run: python3 scripts/installer_next_step_test.py
      - name: Wire comparator negative tests
        run: |
          python3 scripts/chat_wire_baseline_test.py
          python3 scripts/chronology_wire_migration_test.py
          python3 scripts/web_subagent_r2_wire_migration_test.py
          python3 scripts/harness_identity_migration_test.py
          python3 scripts/agents_md_migration_test.py
          python3 scripts/image_explicit_send_migration_test.py
          python3 scripts/read_file_description_migration_test.py
          python3 scripts/reasoning_history_removal_migration_test.py
          python3 scripts/image_schema_contract_test.py .build/debug/briglia
      - name: Lifecycle comparator negative tests
        run: |
          python3 scripts/chat_lifecycle_baseline_test.py
          python3 scripts/prune_lifecycle_migration_test.py
          python3 scripts/active_compaction_lifecycle_migration_test.py
          python3 scripts/newest_turn_protection_lifecycle_migration_test.py
          python3 scripts/subagent_dialogue_compaction_lifecycle_migration_test.py
          python3 scripts/chronology_lifecycle_migration_test.py
          python3 scripts/web_subagent_r2_lifecycle_migration_test.py
          python3 scripts/output_cap_removal_migration_test.py
          python3 scripts/summary_retention_lifecycle_migration_test.py
          python3 scripts/keep_summaries_lifecycle_migration_test.py
          python3 scripts/prune_schema_contract_test.py
      - name: Configured subscription shipped-client compatibility
        run: python3 scripts/subscription_client_test.py .build/debug/briglia
      - name: Smoke test
        run: python3 scripts/smoke_test.py .build/debug/briglia
      - name: Quick-setup browser test (best effort on the macOS runner)
        continue-on-error: true
        run: |
          python3 -m pip install --break-system-packages playwright==1.55.0 || python3 -m pip install playwright==1.55.0
          python3 -m playwright install chromium
          python3 scripts/quicksetup_browser_test.py .build/debug/briglia
          python3 scripts/quicksetup_browser_test.py .build/debug/briglia --close-at-finish
          python3 scripts/quicksetup_main_provider_browser_test.py .build/debug/briglia
          python3 scripts/subscription_browser_test.py
          python3 scripts/menu_browser_test.py
      - name: Browser settings browser test
        run: python3 scripts/browser_settings_test.py .build/debug/briglia
      - name: Security Phase 0 (dependency inventory, security watch, resolved Swift pins, read-only Security line)
        run: python3 scripts/security_phase0_test.py .build/debug/briglia
      - name: Security Phase 2 (signed security metadata, release tooling, update-available notice)
        run: python3 scripts/security_phase2_test.py .build/debug/briglia
      - name: Security Phase 3 (known-vulnerability check of your own tools, signed advisory list, local matching, send-once messages)
        run: python3 scripts/security_phase3_test.py .build/debug/briglia
      - name: gws / WhatsApp removal (retirement migration selftest, wire-migration negative tests)
        run: |
          python3 scripts/drop_gws_whatsapp_migration_test.py
          .build/debug/briglia __retired-integrations-selftest
      - name: Security Phase 1 (private AgentMail / Node / Python runtimes, pin-freshness release gate)
        run: python3 scripts/security_phase1_test.py .build/debug/briglia

  macos-gates:
    name: macOS gates
    runs-on: macos-15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
      - name: Chat Completions pinned-release differential gate
        run: python3 scripts/chat_wire_baseline.py --save-reference chat-wire-reference.json --baseline scripts/fixtures/chat-wire/ci-darwin-arm64-r2.json
      - name: Preserve pinned-release reference
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chat-wire-reference-${{ runner.os }}-${{ runner.arch }}
          path: chat-wire-reference.json
      - name: Chat Completions lifecycle r3 and shipped-client differential gate
        # The frozen macOS fixture embeds rendered PDF pages whose Apple ICC
        # profile comes from the runner's OS image. One reviewed fixture per
        # runner image (see scripts/fixtures/chat-lifecycle/r2-provenance.json);
        # an image without a fixture fails closed and needs a reviewed recording.
        run: |
          echo "runner image: $ImageOS $ImageVersion"
          case "$ImageVersion" in
            20260829.*) fixture=scripts/fixtures/chat-lifecycle/ci-darwin-arm64-r2.json ;;
            20260907.*) fixture=scripts/fixtures/chat-lifecycle/ci-darwin-arm64-r2-image20260907.json ;;
            *) echo "no frozen lifecycle fixture recorded for runner image '$ImageVersion'"; exit 1 ;;
          esac
          python3 scripts/chat_lifecycle_baseline.py --save-reference chat-lifecycle-reference.json --baseline "$fixture"
      - name: Preserve pinned lifecycle reference
        # The reference is built from the pinned SOURCE, never the candidate, so
        # it is worth keeping when the frozen comparison fails: that is exactly
        # the evidence needed to review an environmental drift (runner image).
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chat-lifecycle-reference-${{ runner.os }}-${{ runner.arch }}
          path: chat-lifecycle-reference.json
      - name: Active-turn compaction owners and negative controls
        run: |
          python3 scripts/active_compaction_contract_test.py
          python3 scripts/active_turn_compaction_test.py
      - name: Snapshot owner transactions and Mind transfer
        run: python3 scripts/prune_archive_owner_test.py
      - name: Responses real-owner lifecycle
        run: python3 scripts/responses_lifecycle_test.py
      - name: User-profile maintenance against v0.2.48 (unchanged requests, downgrade and re-upgrade)
        run: python3 scripts/user_context_wire_test.py

  ci-complete:
    name: CI complete
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs:
      - linux-core
      - linux-gates-a
      - linux-gates-b
      - macos-core
      - macos-gates
    steps:
      - name: Require every job to have succeeded
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          expected = {"linux-core", "linux-gates-a", "linux-gates-b", "macos-core", "macos-gates"}
          needs = json.loads(os.environ["NEEDS_JSON"])
          bad = sorted(k for k in expected if needs.get(k, {}).get("result") != "success")
          if set(needs) != expected or bad:
              print("not all jobs succeeded:", {k: v.get("result") for k, v in needs.items()}, file=sys.stderr)
              sys.exit(1)
          print("all five jobs succeeded")
          PY
