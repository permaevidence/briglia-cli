name: Release (signed)

# The hardened, signed release pipeline (docs/RELEASE_SIGNING_PLAN.md §7):
# authorize → build (3 platforms, GitHub-hosted only) → assemble manifest →
# sign (release-sign environment) → verify candidate → publish one immutable
# GitHub Release (draft assembled, envelope last, published atomically) →
# verify through the public path (authenticate with the committed key FIRST,
# then require byte-identity with the verified candidate). The transitional
# legacy Blob dual-publish job was removed when the §6.3 window closed
# (2026-08-31); Vercel is outside the software trust chain.
#
# Runs only where the release channel is armed (repository variable
# RELEASE_CHANNEL_ENABLED=true: the public canonical repo, and the staging
# repo during Phase B). The private archive never sets it.
#
# Secret separation (§7.3): the signing job holds only the signing key and a
# read-only token; the publishing job holds contents:write but never the
# key; builds hold neither.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

# One production publication at a time, never cancelled mid-publish: a stale
# run is stopped by the sequence re-check inside the group, not by a cancel
# that could interrupt a half-published draft.
concurrency:
  group: briglia-cli-release-signed
  cancel-in-progress: false

permissions:
  contents: read

env:
  EXPECTED_PUBKEY: .github/release-keys/briglia-cli-release.pub.pem

jobs:
  authorize:
    name: Authorize (credential-free)
    if: vars.RELEASE_CHANNEL_ENABLED == 'true'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.gate.outputs.version }}
      sequence: ${{ steps.gate.outputs.sequence }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
      - name: Gate checks
        id: gate
        env:
          # Context values only ever cross into the shell via env (§7.1) —
          # a malicious-but-valid tag name must never be shell-evaluated.
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [ "$REF_TYPE" = "tag" ] || { echo "✖ not a tag push"; exit 1; }
          printf '%s' "$REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "✖ tag '$REF_NAME' is not exact SemVer"; exit 1; }
          VERSION="${REF_NAME#v}"

          # The tagged commit must be reachable from protected main.
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "✖ tagged commit is not on protected main"; exit 1; }

          # Source sequence constant (the reviewed monotonic sequence).
          SEQUENCE="$(grep -E '^let adaCLIReleaseSequence = [0-9]+$' \
            TelegramConcierge/CLI/ReleaseSigning.swift | grep -oE '[0-9]+')"
          [ -n "$SEQUENCE" ] || { echo "✖ adaCLIReleaseSequence not found"; exit 1; }

          [ -f "$EXPECTED_PUBKEY" ] || { echo "✖ committed expected public key missing"; exit 1; }

          # Live-channel supersession floor (shared script, also tested
          # against a fake channel by scripts/publisher_selftest.py): ours
          # must be strictly greater than the latest AUTHENTICATED live
          # sequence; there is no bootstrap path (retired after v0.1.58).
          SEQUENCE="$SEQUENCE" REF_NAME="$REF_NAME" REPO="$REPO" EXPECTED_PUBKEY="$EXPECTED_PUBKEY" \
            ./.github/scripts/check-supersession.sh

          # Signed security metadata (security plan v8 §4.4): verify every
          # PUBLISHED release with the committed key (enumerated, never
          # `latest` alone), then run the authorize checks of the reviewed
          # RELEASE_SECURITY.json against that history. Fails closed.
          HISTORY="$(mktemp -d)"
          python3 .github/scripts/release_security.py fetch-history \
            --repo "$REPO" --pubkey "$EXPECTED_PUBKEY" --out "$HISTORY"
          python3 .github/scripts/release_security.py authorize \
            --file RELEASE_SECURITY.json --sequence "$SEQUENCE" --history "$HISTORY"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sequence=$SEQUENCE" >> "$GITHUB_OUTPUT"

  build-macos-arm64:
    name: Build macOS arm64
    needs: authorize
    runs-on: macos-15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Stamp version
        env:
          VERSION: ${{ needs.authorize.outputs.version }}
        run: ./.github/scripts/stamp-version.sh "$VERSION"
      - name: Build
        run: swift build -c release --force-resolved-versions
      - name: Release-artifact checks (development-only commands refuse; migration path answers)
        run: ./.github/scripts/check-release-artifact.sh .build/release/briglia
      - name: Package
        run: |
          mkdir -p dist
          cp LICENSE THIRD_PARTY_NOTICES.md .build/release/
          tar -czf dist/briglia-macos-arm64.tar.gz -C .build/release briglia briglia-cli_briglia.bundle LICENSE THIRD_PARTY_NOTICES.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: briglia-macos-arm64
          path: dist/briglia-macos-arm64.tar.gz

  build-linux-x64:
    name: Build Linux x64
    needs: authorize
    runs-on: ubuntu-latest
    # swift:6.1-jammy (multi-arch index, resolved 2026-08-30)
    container: swift@sha256:159943c473b8d7c57fb18d1f0e9cd7f3b011f05511a39ee1f53ed92bc6cd13d9
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Stamp version
        env:
          VERSION: ${{ needs.authorize.outputs.version }}
        run: ./.github/scripts/stamp-version.sh "$VERSION"
      - name: Build (static Swift stdlib)
        run: swift build -c release --static-swift-stdlib --force-resolved-versions
      - name: Release-artifact checks (development-only commands refuse; migration path answers)
        run: ./.github/scripts/check-release-artifact.sh .build/release/briglia
      - name: Package
        run: |
          mkdir -p dist
          cp LICENSE THIRD_PARTY_NOTICES.md .build/release/
          tar -czf dist/briglia-linux-x64.tar.gz -C .build/release briglia briglia-cli_briglia.resources LICENSE THIRD_PARTY_NOTICES.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: briglia-linux-x64
          path: dist/briglia-linux-x64.tar.gz

  build-linux-arm64:
    name: Build Linux arm64 (native)
    needs: authorize
    # GitHub-hosted native ARM runner — validated 2026-08-30 (4 CPU/16 GB,
    # release build 4m15s). QEMU fallback documented in the plan, §7.2.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    container: swift@sha256:159943c473b8d7c57fb18d1f0e9cd7f3b011f05511a39ee1f53ed92bc6cd13d9
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Stamp version
        env:
          VERSION: ${{ needs.authorize.outputs.version }}
        run: ./.github/scripts/stamp-version.sh "$VERSION"
      - name: Build (static Swift stdlib)
        run: swift build -c release --static-swift-stdlib --force-resolved-versions
      - name: Release-artifact checks (development-only commands refuse; migration path answers)
        run: ./.github/scripts/check-release-artifact.sh .build/release/briglia
      - name: Package
        run: |
          mkdir -p dist
          cp LICENSE THIRD_PARTY_NOTICES.md .build/release/
          tar -czf dist/briglia-linux-arm64.tar.gz -C .build/release briglia briglia-cli_briglia.resources LICENSE THIRD_PARTY_NOTICES.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: briglia-linux-arm64
          path: dist/briglia-linux-arm64.tar.gz

  assemble:
    name: Assemble manifest
    needs: [authorize, build-macos-arm64, build-linux-x64, build-linux-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Build manifest (all three platforms required)
        env:
          VERSION: ${{ needs.authorize.outputs.version }}
          SEQUENCE: ${{ needs.authorize.outputs.sequence }}
          RELEASE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for platform in macos-arm64 linux-x64 linux-arm64; do
            [ -f "dist/briglia-$platform.tar.gz" ] || { echo "✖ missing dist/briglia-$platform.tar.gz"; exit 1; }
          done
          python3 .github/scripts/release_security.py emit \
            --file RELEASE_SECURITY.json --sequence "$SEQUENCE" --out dist/security-fragment.json
          SECURITY_FRAGMENT=dist/security-fragment.json \
            ./.github/scripts/build-manifest.sh "$VERSION" "$SEQUENCE" dist/manifest.json
          rm -f dist/security-fragment.json
          cat dist/manifest.json
          # Checksum sidecars for the installer's disclosed TLS-bootstrap
          # fallback (systems without python3/openssl); signed-path clients
          # never read them.
          for tarball in dist/briglia-*.tar.gz; do
            (cd dist && sha256sum "$(basename "$tarball")" > "$(basename "$tarball").sha256")
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: manifest
          path: |
            dist/manifest.json
            dist/*.sha256

  sign:
    name: Sign metadata
    needs: [authorize, assemble]
    runs-on: ubuntu-latest
    environment: release-sign
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: manifest
          path: dist
      - name: Sign the manifest
        env:
          SIGNING_KEY_B64: ${{ secrets.BRIGLIA_CLI_SIGNING_KEY }}
        run: |
          set -euo pipefail
          [ -n "$SIGNING_KEY_B64" ] || { echo "✖ BRIGLIA_CLI_SIGNING_KEY is not configured"; exit 1; }
          KEYFILE="$(mktemp)"
          chmod 600 "$KEYFILE"
          trap 'rm -f "$KEYFILE"' EXIT
          printf '%s' "$SIGNING_KEY_B64" | base64 -d > "$KEYFILE"
          EXPECTED_PUBKEY_PEM="$EXPECTED_PUBKEY" \
            ./.github/scripts/sign-envelope.sh "$KEYFILE" briglia-cli dist/manifest.json dist/manifest.sig.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: envelope
          path: dist/manifest.sig.json

  verify-candidate:
    name: Verify candidate (${{ matrix.label }})
    needs: [authorize, sign]
    strategy:
      fail-fast: true
      matrix:
        include:
          - label: macos
            os: macos-15
            platform: macos-arm64
          - label: linux
            os: ubuntu-latest
            platform: linux-x64
          - label: linux-arm64
            os: ubuntu-24.04-arm
            platform: linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Run the built binary's own verifier over the fresh envelope
        env:
          VERSION: ${{ needs.authorize.outputs.version }}
          SEQUENCE: ${{ needs.authorize.outputs.sequence }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          mkdir extracted
          tar -xzf "dist/briglia-$PLATFORM.tar.gz" -C extracted
          ./extracted/briglia __verify-envelope dist/manifest.sig.json \
            --expect-version "$VERSION" --expect-sequence "$SEQUENCE"
          # The authenticated hashes must match the actual artifacts.
          python3 - <<'PYEOF'
          import base64, hashlib, json
          payload = json.loads(base64.b64decode(json.load(open("dist/manifest.sig.json"))["payload"]))
          for platform, entry in payload["platforms"].items():
              path = f"dist/briglia-{platform}.tar.gz"
              digest = hashlib.sha256(open(path, "rb").read()).hexdigest()
              assert digest == entry["sha256"], f"hash mismatch for {platform}"
              import os
              assert os.path.getsize(path) == entry["size"], f"size mismatch for {platform}"
          print("artifact hashes and sizes match the authenticated manifest")
          PYEOF

  publish:
    name: Publish immutable release
    needs: [authorize, verify-candidate]
    runs-on: ubuntu-latest
    environment: release-publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Re-check supersession inside the publish lock
        env:
          SEQUENCE: ${{ needs.authorize.outputs.sequence }}
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: ./.github/scripts/check-supersession.sh
      - name: Assemble draft, envelope last, publish once (confirmed by re-read)
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          VERSION: ${{ needs.authorize.outputs.version }}
          REPO: ${{ github.repository }}
        run: ./.github/scripts/publish-release.sh

  verify-production:
    name: Verify public channel (${{ matrix.label }})
    needs: [authorize, publish]
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macos
            os: macos-15
            platform: macos-arm64
          - label: linux
            os: ubuntu-latest
            platform: linux-x64
          - label: linux-arm64
            os: ubuntu-24.04-arm
            platform: linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      # The committed expected key + verifier script are the trust anchor
      # here; the candidate artifacts (already verified by verify-candidate)
      # are what the public bytes must equal. The downloaded binary is run
      # only AFTER authentication, as a functional check.
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Authenticate, then download and compare through the public latest path
        env:
          VERSION: ${{ needs.authorize.outputs.version }}
          SEQUENCE: ${{ needs.authorize.outputs.sequence }}
          PLATFORM: ${{ matrix.platform }}
          REPO: ${{ github.repository }}
          CANDIDATE_TARBALL: dist/briglia-${{ matrix.platform }}.tar.gz
          CANDIDATE_ENVELOPE: dist/manifest.sig.json
        run: ./.github/scripts/verify-public-release.sh
