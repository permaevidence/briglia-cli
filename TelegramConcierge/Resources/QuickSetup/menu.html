<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>Briglia</title>
<link rel="stylesheet" href="/menu.css">
</head>
<body>
<div class="lang-switch" id="lang-switch" role="group" aria-label="Language"></div>
<div class="shell">
  <aside class="side">
    <div class="brand">
      <div class="logo" id="logo"></div>
      <div>
        <div class="name">Briglia</div>
        <div class="tag" id="brand-tag">Setup</div>
      </div>
    </div>
    <div class="mobilebar">
      <div class="count"><span id="m-step"></span><span id="m-left"></span></div>
      <div class="progress"><span id="m-progress"></span></div>
    </div>
    <ol class="steps" id="steps"></ol>
    <p class="note" id="side-note"></p>
  </aside>
  <main>
    <section class="card" id="card" aria-live="polite"></section>
    <div class="footer" id="footer"></div>
  </main>
</div>
<script src="/menu.js"></script>
</body>
</html>
